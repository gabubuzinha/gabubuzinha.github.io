name: Publicar Memórias de Nós

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Configurar o Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir o site
        run: npm run build

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar os arquivos
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v5
